name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-dmg]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare verified Chinese font
        run: python macos/prepare_assets.py
      - name: Test game logic and platform support
        run: |
          python -m unittest discover -s tests -p test_game.py -v
          python -m unittest discover -s tests -p test_platform.py -v
      - name: Build app, smoke test, and verify DMG
        run: python macos/build_macos.py
      - name: Check native macOS window rendering
        run: python macos/native_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedHighway-macOS-${{ matrix.arch }}
          path: |
            dist/macos/${{ matrix.arch }}/*.dmg
            dist/macos/${{ matrix.arch }}/*.sha256
            dist/macos/${{ matrix.arch }}/*.json
            dist/macos/${{ matrix.arch }}/*.png
            dist/macos/${{ matrix.arch }}/*.txt
          if-no-files-found: error
          retention-days: 30
