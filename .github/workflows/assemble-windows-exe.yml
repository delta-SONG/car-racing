name: Assemble Windows EXE branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows-exe
      - name: Download verified executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download windows-exe-transfer-20260911 --repo delta-SONG/car-racing --pattern SpeedHighway3D.exe --dir dist/windows
      - name: Verify and commit executable
        shell: pwsh
        run: |
          $expected = '4DF9BA3535796665E31B5536892E29B4A24145C2E346AD2F32D07010891644C4'
          $executable = 'dist/windows/SpeedHighway3D.exe'
          $actual = (Get-FileHash -Algorithm SHA256 $executable).Hash
          if ($actual -ne $expected) { throw "SHA-256 mismatch: $actual" }
          "$expected  SpeedHighway3D.exe" | Set-Content -Encoding ascii 'dist/windows/SpeedHighway3D.exe.sha256'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f $executable 'dist/windows/SpeedHighway3D.exe.sha256'
          git rm '.github/workflows/assemble-windows-exe.yml'
          git commit -m 'Publish Windows 3D executable'
          git push origin HEAD:codex/windows-exe
